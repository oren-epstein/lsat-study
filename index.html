<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LSAT Study (private)</title>
<style>
:root{--blue:#1865f2;--blue-d:#0b4ac4;--blue-l:#e8f0fe;--green:#14a37f;--green-d:#0e7a5f;--green-l:#e3f6f0;--red:#d92916;--red-l:#fdecea;--amber:#f5a623;--amber-l:#fff4de;--ink:#21242c;--mute:#5f6673;--line:#dde1e7;--bg:#f4f6f9;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:16px}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:#0a2540;color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;height:56px}
.brand{font-weight:700;font-size:18px;letter-spacing:.2px;white-space:nowrap}
.brand small{font-weight:500;font-size:11px;background:var(--green);padding:2px 7px;border-radius:10px;margin-left:6px;vertical-align:middle}
.menu{display:none;background:none;border:0;color:#fff;font-size:22px;padding:4px 8px}
.tabs{display:flex;gap:4px;margin-left:auto;height:100%}
.tabs button{background:none;border:0;color:#b9c8da;padding:0 14px;height:100%;border-bottom:3px solid transparent;font-weight:600}
.tabs button.on{color:#fff;border-bottom-color:var(--green)}
.tabs button:hover{color:#fff}
.layout{display:flex;min-height:calc(100vh - 56px)}
aside{width:290px;flex:none;background:#fff;border-right:1px solid var(--line);padding:16px 14px 30px;overflow-y:auto;position:sticky;top:56px;height:calc(100vh - 56px)}
main{flex:1;min-width:0;padding:24px;max-width:1100px;margin:0 auto;width:100%}
.layout.nosb aside{display:none}
.sb-h{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);margin:18px 6px 6px}
.sb-item{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;color:var(--ink)}
.sb-item:hover{background:var(--bg)}
.sb-item.on{background:var(--blue-l)}
.sb-item .nm{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14.5px}
.sb-item .nm span:last-child{font-weight:500;color:var(--mute);font-size:12.5px}
.bar{height:8px;background:#e6e9ee;border-radius:6px;overflow:hidden;display:flex;margin-top:5px}
.bar i{display:block;height:100%}
.bar .g{background:var(--green)}.bar .a{background:var(--amber)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
h1{font-size:26px;margin:0 0 4px}h2{font-size:20px;margin:0 0 10px}h3{font-size:16px;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 18px}
.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,#0a2540,#1865f2);color:#fff;border:0}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--green) calc(var(--p)*1%),rgba(255,255,255,.22) 0)}
.ring div{width:82px;height:82px;border-radius:50%;background:#0f3d8f;display:grid;place-items:center;font-size:24px;font-weight:700}
.hero p{margin:2px 0;color:#dbe7ff}
.btn{border:0;border-radius:8px;padding:10px 18px;font-weight:700;background:var(--blue);color:#fff}
.btn:hover{background:var(--blue-d)}
.btn.green{background:var(--green)}.btn.green:hover{background:var(--green-d)}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn.ghost:hover{background:var(--blue-l)}
.btn.danger{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn.danger:hover{background:var(--red-l)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hero .btn.ghost{background:transparent;color:#fff;border-color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:22px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;border-top:4px solid var(--blue)}
.tcard.rc{border-top-color:var(--green)}
.tcard:hover{box-shadow:0 4px 14px rgba(10,37,64,.12)}
.tcard b{display:block;margin-bottom:2px}
.tcard small{color:var(--mute)}
.lesson{border-left:5px solid var(--blue)}
.tip{background:var(--green-l);border-left:4px solid var(--green);padding:10px 14px;border-radius:6px;margin-top:12px}
.dots{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:700;color:var(--mute)}
.dot.ok{background:var(--green);border-color:var(--green);color:#fff}
.dot.bad{background:var(--amber);border-color:var(--amber);color:#fff}
.dot.cur{outline:3px solid var(--blue-l);border-color:var(--blue)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.crumb{background:none;border:0;color:var(--blue);font-weight:600;padding:0;margin-bottom:10px}
.qhead{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:8px;gap:10px;flex-wrap:wrap}
.badge{background:var(--blue-l);color:var(--blue-d);border-radius:10px;padding:2px 9px;font-size:12px;font-weight:700}
.badge.rc{background:var(--green-l);color:var(--green-d)}
.badge.amber{background:var(--amber-l);color:#8a5a00}
.stim{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px;white-space:pre-line}
.qstem{font-weight:700;margin-bottom:12px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px;color:var(--ink)}
.choice:hover:not([disabled]){border-color:var(--blue);background:var(--blue-l)}
.choice .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--mute)}
.choice.right{border-color:var(--green);background:var(--green-l)}
.choice.right .l{background:var(--green);border-color:var(--green);color:#fff}
.choice.wrong{border-color:var(--red);background:var(--red-l)}
.choice.wrong .l{background:var(--red);border-color:var(--red);color:#fff}
.choice[disabled]{cursor:default}
.fb{border-radius:10px;padding:12px 16px;margin:14px 0 8px;font-weight:700}
.fb.ok{background:var(--green-l);color:var(--green-d)}.fb.no{background:var(--red-l);color:var(--red)}
.exp{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.exp ul{list-style:none;padding:0;margin:8px 0 0}
.exp li{padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.exp li b.c{color:var(--green-d)}.exp li b.x{color:var(--red)}
.rcwrap{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.passage{max-height:78vh;overflow:auto;position:sticky;top:72px}
.passage p{margin:0 0 12px;font-family:Georgia,"Times New Roman",serif;font-size:16.5px;line-height:1.6}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:8px}
.stats b{font-size:22px;display:block}
.stats span{color:#dbe7ff;font-size:13px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute)}
.tblwrap{overflow-x:auto}
label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
input,select{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;width:100%;background:#fff}
input:focus,select:focus{outline:none;border-color:var(--blue)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.misses{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:8px 0 14px}
.misses label{font-weight:500;font-size:13px}
.err{color:var(--red);font-weight:600;margin:8px 0}
.empty{color:var(--mute);padding:14px;text-align:center}
.wk{display:grid;grid-template-columns:150px 1fr 70px auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.wk .bar{margin:0;height:12px}.wk .bar .a{background:var(--blue)}
.note{font-size:13px;color:var(--mute);margin-top:22px;text-align:center}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:700}
.pill.lr{background:var(--blue-l);color:var(--blue-d)}.pill.rc{background:var(--green-l);color:var(--green-d)}
@media(max-width:860px){
 .menu{display:block}
 .brand small{display:none}
 aside{position:fixed;z-index:15;top:56px;left:0;bottom:0;height:auto;transform:translateX(-102%);transition:transform .2s;box-shadow:4px 0 18px rgba(0,0,0,.18)}
 aside.open{transform:none}
 main{padding:14px}
 .rcwrap{grid-template-columns:1fr}
 .passage{position:static;max-height:none}
 .tabs button{padding:0 9px;font-size:14px}
 .wk{grid-template-columns:110px 1fr 54px;}
 .wk .go{grid-column:1/-1}
 h1{font-size:22px}
 .top{gap:6px;padding:0 8px}
 .brand{font-size:16px}
}
.banner{background:#fff7e0;border:1px solid #f0d58a;border-left:4px solid #e0a100;border-radius:8px;padding:12px 16px;margin:0 0 16px;font-size:15px}
.method ol{margin:8px 0 0;padding-left:22px}.method li{margin:6px 0}
.passage h4.ph{margin:14px 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.blindrow{display:grid;grid-template-columns:1fr minmax(0,230px);gap:14px;align-items:end;margin:14px 0}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500}.chk input{width:auto;margin-top:4px}
@media(max-width:700px){.blindrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
 <button class="menu" id="menu" aria-label="Topics">☰</button>
 <div class="brand">LSAT Study <small>private</small></div>
 <nav class="tabs" id="tabs">
  <button data-tab="practice">Practice</button>
  <button data-tab="tracker">Real tests</button>
  <button data-tab="data">Data</button>
 </nav>
</header>
<div class="layout" id="layout">
 <aside id="side"></aside>
 <main id="main"></main>
</div>
<script>
/* ===== CONTENT: all questions and passages below are ORIGINAL, written for this tool. None is real LSAT text. Generated by build/build.js ===== */
const TOPICS = [
 {
  "id": "main",
  "kind": "LR",
  "name": "Main Point",
  "short": "Find the conclusion",
  "lesson": "The main point is the conclusion that the whole argument is built to support. Premises give reasons; the conclusion is what those reasons are for. Look for indicator words such as “therefore,” “thus,” and “consequently,” and for the claim the author is trying to persuade you of. Watch for intermediate conclusions: a claim can be supported by premises and still be used to support something larger.",
  "tip": "Ask of each claim, “Is this being used to support something else?” If so, it is a premise or intermediate conclusion. The main point is the claim that nothing else is there to support. Wrong answers are usually premises or overreach."
 },
 {
  "id": "nassume",
  "kind": "LR",
  "name": "Necessary Assumption",
  "short": "What must be true",
  "lesson": "A necessary assumption is something the argument cannot do without: if it were false, the conclusion would fall apart. It is usually a modest claim, much weaker than the one that would prove the conclusion. Find the gap, often a new term or a leap from evidence to conclusion, and ask what has to be true for the evidence to reach it. Common patterns include “no other cause explains the result,” “the sample is representative,” and “the plan can actually be carried out.”",
  "tip": "Use the negation test: negate the answer, and if the argument collapses, that answer is necessary. Wrong answers are often helpful but not required, or too strong (“all,” “most,” “no,” “every”)."
 },
 {
  "id": "sassume",
  "kind": "LR",
  "name": "Sufficient Assumption",
  "short": "What guarantees the conclusion",
  "lesson": "A sufficient assumption is a premise that, added to the stated ones, guarantees the conclusion. It can be much stronger than a necessary assumption. Typically the stated premises contain a conditional or a gap between two terms, and the right answer supplies the missing link, often as an if-then statement running in the right direction.",
  "tip": "Write the argument as: premises + ? = conclusion. Add each answer and ask whether the conclusion is now guaranteed. Watch for answers that reverse a conditional (A→B is not B→A) and for ones that merely restate a premise. Use the contrapositive when the conclusion is negative."
 },
 {
  "id": "strengthen",
  "kind": "LR",
  "name": "Strengthen",
  "short": "Support the argument",
  "lesson": "Strengthen questions ask which new fact makes the conclusion more likely to be true. You do not need to prove it. The best answers usually confirm the assumption, rule out an alternative explanation, or add evidence that fits the author’s hypothesis. Treat the answer choices as true and ask whether the argument looks better.",
  "tip": "In causal arguments, the strongest help is often (a) a control or comparison group, or (b) ruling out another cause. Be careful not to confuse “irrelevant but true” with “helpful.”"
 },
 {
  "id": "weaken",
  "kind": "LR",
  "name": "Weaken",
  "short": "Attack the argument",
  "lesson": "Weaken questions ask which fact makes the conclusion less likely. The author’s conclusion can still be true; you are looking for the answer that damages the support. Common moves: offer an alternative cause, show the evidence is unrepresentative, show the link is reversed, or deny the assumption. Treat each choice as true, then ask if the argument now looks shakier.",
  "tip": "A correct weaken answer attacks the connection between evidence and conclusion, not the conclusion on a side issue. Answers about cost, feelings, or motives that do not touch the link are usually traps."
 },
 {
  "id": "flaw",
  "kind": "LR",
  "name": "Flaw",
  "short": "Spot the reasoning error",
  "lesson": "Flaw questions ask why the reasoning is vulnerable. A handful of errors come up again and again: confusing correlation with causation (or ignoring reverse causation); treating a necessary condition as sufficient; assuming what is true of the parts is true of the whole or the reverse; unrepresentative or self-selected samples; comparing numbers when rates matter; shifting the meaning of a key term (equivocation); and attacking a person rather than a claim. First find the conclusion and the gap between it and the evidence, then match the gap to the answer that describes it in abstract language.",
  "tip": "Answers are written in abstract terms (“takes for granted that…,” “overlooks the possibility that…,” “treats… as…”). Translate the argument into that language before reading the choices. A right answer must describe something the argument actually does."
 },
 {
  "id": "infer",
  "kind": "LR",
  "name": "Must Be True / Most Strongly Supported",
  "short": "What follows from the facts",
  "lesson": "These questions give you facts and ask what follows. “Must be true” questions want an answer guaranteed by the statements. “Most strongly supported” questions allow an answer that is well backed by the statements even if it is not strictly guaranteed. Either way, the right answer is usually modest and says less than the stimulus does. Combine statements that share a term and track the logic words carefully: all, some, most, none, only.",
  "tip": "Reject answers that need an extra assumption, bring in new information, or push a claim further (“always,” “main reason,” “most”). Ask: could I point to the exact words that back this up?"
 },
 {
  "id": "pissue",
  "kind": "LR",
  "name": "Point at Issue",
  "short": "Where two speakers disagree",
  "lesson": "Two speakers each make a claim, and you must find the question on which they would give different answers. Both speakers must hold an opinion on it, stated or clearly implied, and their opinions must conflict (one says yes, the other no). Traps include points both accept, points only one speaker addresses, and disagreements about reasons rather than the issue itself.",
  "tip": "For each choice ask: “What would speaker 1 say? What would speaker 2 say?” If either has no opinion, or if they would answer the same way, eliminate it."
 },
 {
  "id": "role",
  "kind": "LR",
  "name": "Role of a Statement",
  "short": "What job a claim does",
  "lesson": "These questions point to a sentence and ask what job it does in the argument: main conclusion, intermediate conclusion, premise, counterpremise or concession (a point the author grants or raises and answers), example, or background. Find the main conclusion first, then ask whether the highlighted claim is being supported, is supporting something, or is being set aside.",
  "tip": "Ask “Why is the author saying this?” and “Is this supported by something, or supporting something?” Claims attributed to opponents are usually targets or concessions, not the author’s own reasoning."
 },
 {
  "id": "eval",
  "kind": "LR",
  "name": "Evaluate the Argument",
  "short": "Ask the question that matters",
  "lesson": "In an evaluate question the answer choices are questions. The right one asks about something that makes a difference: one answer would strengthen the argument and the opposite answer would weaken it. It targets the assumption or the alternative explanation behind the argument.",
  "tip": "Take each question and imagine answering yes, then no. If the argument ends up in the same place either way, the question is irrelevant. The right choice must matter in both directions."
 },
 {
  "id": "cond",
  "kind": "LR",
  "name": "Conditional Reasoning",
  "short": "If–then logic and contrapositives",
  "lesson": "Many LR questions hide if–then statements. “If A then B” makes A sufficient for B and B necessary for A. “A only if B” means “if A then B.” “A unless B” means “if not B then A.” “All,” “every,” and “any” also signal conditionals. The contrapositive (“if not B then not A”) is always equivalent. The converse (“if B then A”) and the inverse (“if not A then not B”) are not. Chain statements that share a term.",
  "tip": "Write each rule with an arrow and its contrapositive, then chain them. The sufficient side is the trigger, the necessary side the requirement. Never turn “if” into “if and only if” unless the stimulus does."
 },
 {
  "id": "parallel",
  "kind": "LR",
  "name": "Parallel Reasoning",
  "short": "Match the structure",
  "lesson": "Parallel reasoning questions ask you to find the answer whose argument has the same structure as the one in the stimulus. Subject matter does not matter; form does. Reduce the stimulus to a skeleton (for example, “All A are B; x is not A; so x is not B”), noting the quantifiers and whether the form is valid. Then test each choice against the skeleton.",
  "tip": "Check the conclusion first, then the premises. Eliminate any choice with a different quantifier (all vs. some vs. most), a different negation, or a different validity."
 },
 {
  "id": "principle",
  "kind": "LR",
  "name": "Principle",
  "short": "Rules and cases",
  "lesson": "Principle questions work in one of two directions. Either you are given a general rule and must pick the case that fits it, or you are given a specific case and must pick the general rule that would justify it. A good principle is broad enough to cover the case but not so broad that it sweeps in unrelated situations.",
  "tip": "When given a principle, check that each answer’s facts trigger the rule, and watch for “unless”: the rule tells you what happens when the exception does not apply. When justifying a case, reject answers that go much further than the facts."
 },
 {
  "id": "paradox",
  "kind": "LR",
  "name": "Paradox / Resolve",
  "short": "Explain the puzzle",
  "lesson": "A paradox question presents two facts that seem to conflict and asks you to explain how both can be true. The right answer introduces a new fact that makes the apparent conflict go away, often by pointing out a difference between two groups, two time periods, or two measures. Wrong answers tend to explain only one half, or deepen the puzzle.",
  "tip": "Say the puzzle out loud: “How can X happen while Y also happens?” Then look for the answer that gives a reason both can be true. Anything that only supports one side is wrong."
 },
 {
  "id": "method",
  "kind": "LR",
  "name": "Method of Reasoning",
  "short": "How the argument works",
  "lesson": "Method of reasoning questions ask how the argument proceeds, not whether it is good. Describe what the author does in plain terms: cites a counterexample, argues by analogy, shows a feature is missing, attacks an assumption, or derives an absurd consequence. The right answer will describe the argument’s structure in abstract language that fits what actually happens.",
  "tip": "Make your own short description first (“he gives one case that breaks a general rule”), then find the answer that matches. Reject choices that name a technique the author never uses."
 }
];
const PASSAGES = [
 {
  "id": "rc1",
  "kind": "RC",
  "name": "Passage 1: Craft Guilds",
  "short": "History / humanities · 6 questions",
  "lesson": "Reading Comprehension rewards reading for structure and voice rather than memorizing details. As you read, note the purpose of each paragraph (describe a view, challenge it, propose a resolution) and where the author’s own opinion appears. Detail questions can be looked up; main idea, attitude, and function questions depend on the big picture. Read the passage once through, then answer.",
  "tip": "Watch for contrast and judgment words (“however,” “tempting,” “hardly surprising”). They show where the author’s voice enters, which drives attitude, function, and main-idea questions.",
  "text": [
   "For much of the twentieth century, economic historians treated the craft guilds of late medieval Europe as little more than cartels. Guild members, on this view, used their control over who could practice a trade to restrict output, keep prices high, and suppress competition from outsiders. The guilds’ elaborate rules about materials, hours, and methods were read as devices for blocking innovation, and the eventual decline of the guilds was celebrated as a precondition of industrial growth.",
   "In recent decades, a revisionist school has challenged this picture. Its members point out that guilds also ran the apprenticeship system, which was for centuries the main way in which skills were passed from one generation to the next. They argue that guild inspection of finished goods gave buyers, who could not easily judge quality for themselves, a reason to trust products bearing a guild’s mark. On this account, the guilds were not obstacles to commerce but institutions that made commerce possible in a world lacking reliable courts and consumer protection laws.",
   "Each school has been able to marshal impressive evidence, and it is tempting to conclude that one must be right and the other wrong. But the evidence suggests a more complicated story. The revisionists draw heavily on records from cities in which guild members were also leading figures in the municipal government, and in such cities the guilds’ rules were frequently tied to real concerns about quality. The older view, by contrast, rests largely on records from places where guilds were closely allied with a monarch who sold them exclusive privileges in return for fees; there, the rules look much more like tools of exclusion. It is hardly surprising that an institution would behave differently depending on who held power over it and what that power rewarded.",
   "If this is correct, the question historians have long asked, whether guilds were good or bad for the economy, is badly formed. A better question asks under what political conditions guilds tended to serve the public and under what conditions they tended to serve only themselves. Answering it will require less sweeping argument and more careful comparison of the circumstances in which particular guilds operated."
  ]
 },
 {
  "id": "rc2",
  "kind": "RC",
  "name": "Passage 2: Urban Birdsong",
  "short": "Natural science · 6 questions",
  "lesson": "Science passages often present a phenomenon, a leading explanation, evidence for it, and then complications or rivals. Keep track of which claims are the author’s own and which belong to researchers the author reports on. Qualifiers such as “widely accepted,” “plausible,” and “open question” tell you how much confidence the author has.",
  "tip": "Separate what the author reports from what the author thinks. Many wrong answers on attitude and inference questions overstate the author’s confidence (“conclusively,” “never,” “refuted”).",
  "text": [
   "Ornithologists have long observed that members of several songbird species sing at a higher pitch in cities than their rural counterparts do. The most widely accepted explanation is the masking hypothesis: because traffic and machinery produce mostly low-frequency noise, a bird that sings at a higher pitch is more likely to be heard by potential mates and rivals. On this view, the shift is an adaptation, a response to selective pressure exerted by the acoustic environment.",
   "The hypothesis predicts that the pitch of a species’ song should rise with the level of low-frequency noise in a given location. A number of field studies have confirmed this, and in one widely cited experiment, researchers played recordings of traffic near the nests of rural birds and found that the males began to sing at a higher pitch within days. The speed of that change is significant, because it suggests that, in at least some species, the shift does not require generations of selection but can occur through individual birds adjusting their songs on the fly.",
   "Yet the masking hypothesis does not account for every observation. In some cities, researchers have recorded higher-pitched song among birds living in quiet parks that are well removed from major roads. Proponents of masking respond that young birds learn their songs from neighbors, and a song pattern that arose near a noisy road might spread to quieter areas through imitation, lingering there long after its original rationale disappeared. This is plausible, but it is also difficult to test, and it risks becoming an all-purpose explanation that no evidence could contradict.",

  "lesson": "Comparative reading gives you two short passages on one subject. Read A, summarize its position in a phrase, then read B asking how it relates to A: does it agree, disagree, add a cost, offer an example, or shift the question? Most questions test one of three things: what the passages share, where they disagree, and how one passage would react to a point in the other. Be strict about which author said what.",

  "lesson": "Law and social-science passages usually describe a long-standing practice, report research that unsettles it, survey the proposed responses, and then argue for a particular reform. Track who holds each view. “Author would most likely agree” questions need the answer to be supported by the passage’s own claims, not merely plausible. Analogies in a passage (“much as…”) are there for a reason: ask what point the comparison supports.",

  "text": [
   "For most of the history of the common-law courts, an eyewitness who said “that is the man” was treated as close to the best evidence available. Juries find such testimony vivid and persuasive, and judges have long assumed that jurors can weigh a witness’s confidence for themselves. In the past few decades, however, psychologists have accumulated a body of findings that casts doubt on that assumption.",

const ALL = TOPICS.concat(PASSAGES);
const LETTERS = ["A","B","C","D","E"];
const KEY = "lsat-study-v1";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function load(){ try{ const r = JSON.parse(localStorage.getItem(KEY)); if(r && r.answers && Array.isArray(r.tests)) return r; }catch(e){} return {answers:{},tests:[]}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = load();
let V = {tab:"practice", topic:null, quiz:null};
const topicOf = id => ALL.find(t => t.id === id);
const qsOf = id => QS.filter(q => q.t === id);
function stats(ids){
  let total=0, correct=0, missed=0;
  QS.forEach(q => { if(ids && ids.indexOf(q.t) < 0) return; total++; const a = S.answers[q.id]; if(a){ if(a.correct) correct++; else missed++; } });
  return {total, correct, missed, left: total-correct-missed};
}
function bar(st){ return '<div class="bar"><i class="g" style="width:'+(100*st.correct/st.total)+'%"></i><i class="a" style="width:'+(100*st.missed/st.total)+'%"></i></div>'; }
const missedIds = tid => QS.filter(q => (!tid || q.t === tid) && S.answers[q.id] && !S.answers[q.id].correct).map(q => q.id);

/* ---------- sidebar ---------- */
function renderSide(){
  const o = stats();
  let h = '<button class="sb-item'+(V.topic==null&&!V.quiz?' on':'')+'" data-home="1"><div class="nm"><span>Overview</span><span>'+Math.round(100*o.correct/o.total)+'%</span></div>'+bar(o)+'</button>';
  [["LR","Logical Reasoning",TOPICS],["RC","Reading Comprehension",PASSAGES]].forEach(g => {
    h += '<div class="sb-h">'+g[1]+'</div>';
    g[2].forEach(t => {
      const st = stats([t.id]);
      h += '<button class="sb-item'+(V.topic===t.id?' on':'')+'" data-topic="'+t.id+'"><div class="nm"><span>'+esc(t.name)+'</span><span>'+st.correct+'/'+st.total+'</span></div>'+bar(st)+'</button>';
    });
  });
  const m = missedIds().length;
  h += '<div class="sb-h">Review</div><button class="sb-item" data-retry="all"'+(m?'':' disabled')+'><div class="nm"><span>Retry missed</span><span>'+m+'</span></div></button>';
  $("#side").innerHTML = h;
}

/* ---------- practice: home ---------- */
function methodCard(){
  return '<div class="card method" id="method"><h2 style="margin-top:0">Method: how to work a question</h2><ol>'
   + '<li><b>Read the question stem first.</b> Know the task (weaken? main point? must be true?) before you read the stimulus.</li>'
   + '<li><b>Identify the argument.</b> Mark the conclusion, then the premises. In Reading Comprehension, note each paragraph’s job and the author’s voice.</li>'
   + '<li><b>Prephrase.</b> Say what a right answer should look like (the gap, the flaw, the main point) before you read the choices.</li>'
   + '<li><b>Eliminate by wrong-answer type:</b> out of scope, too extreme, reversed, half right and half wrong, or true but irrelevant.</li>'
   + '<li><b>If two remain,</b> go back to the stem and match the task exactly, word for word.</li>'
   + '<li><b>Flag and skip</b> a question that is eating your time, then come back. On real tests you will manage time; here there is no timer. Slow, accurate practice builds the habit first.</li>'
   + '</ol></div>';
}
function viewHome(){
  const o = stats(), pct = Math.round(100*o.correct/o.total), m = missedIds().length;
  let h = '<h1>Practice</h1><p class="sub">Original LSAT-style questions in Logical Reasoning and Reading Comprehension. Pick a topic, read the short lesson, then practice. There is no timer here: accuracy and method come first.</p>';
  h += '<div class="banner" id="lawhub"><b>Start with the real thing.</b> LSAC’s <a href="https://www.lsac.org/lawhub" target="_blank" rel="noopener">LawHub</a> offers free official PrepTests. Do those first, then come back here to drill the question types you miss.</div>';
  h += methodCard();
  h += '<div class="card hero"><div class="ring" style="--p:'+pct+'"><div>'+pct+'%</div></div><div><h2 style="margin:0">Overall mastery</h2><p>Mastery is the share of all practice questions you most recently answered correctly.</p><div class="stats"><div><b>'+o.correct+'</b><span>correct</span></div><div><b>'+o.missed+'</b><span>missed</span></div><div><b>'+o.left+'</b><span>not tried</span></div><div><b>'+o.total+'</b><span>questions</span></div></div><div class="row" style="margin-top:14px"><button class="btn ghost" data-retry="all"'+(m?'':' disabled')+'>Retry missed ('+m+')</button></div></div></div>';
  [["Logical Reasoning","LR",TOPICS],["Reading Comprehension","RC",PASSAGES]].forEach(g => {
    h += '<h2>'+g[0]+'</h2><div class="grid">';
    g[2].forEach(t => { const st = stats([t.id]);
      h += '<button class="tcard '+(g[1]==="RC"?"rc":"")+'" data-topic="'+t.id+'"><b>'+esc(t.name)+'</b><small>'+esc(t.short)+'</small>'+bar(st)+'<small>'+st.correct+' of '+st.total+' correct'+(st.missed?' · '+st.missed+' missed':'')+'</small></button>'; });
    h += '</div>';
  });
  return h;
}

/* ---------- practice: topic page ---------- */
function dotsHtml(tid, cur){
  return '<div class="dots">'+qsOf(tid).map((q,i) => { const a = S.answers[q.id]; return '<button class="dot'+(a?(a.correct?' ok':' bad'):'')+(cur===i?' cur':'')+'" data-jump="'+q.id+'" title="Question '+(i+1)+'">'+(i+1)+'</button>'; }).join("")+'</div>';
}
function viewTopic(){
  const t = topicOf(V.topic), st = stats([t.id]), m = missedIds(t.id).length;
  let h = '<button class="crumb" data-home="1">← All topics</button><h1>'+esc(t.name)+'</h1><p class="sub"><span class="pill '+(t.kind==="LR"?"lr":"rc")+'">'+(t.kind==="LR"?"Logical Reasoning":"Reading Comprehension")+'</span> &nbsp;'+st.correct+' of '+st.total+' correct</p>';
  h += '<div class="card lesson"><h3>Lesson</h3><p style="margin:0">'+esc(t.lesson)+'</p><div class="tip"><b>Tip:</b> '+esc(t.tip)+'</div></div>';
  h += '<div class="card"><h3>Your progress</h3>'+bar(st)+dotsHtml(t.id)+'<div class="row"><button class="btn green" data-start="'+t.id+'">'+(st.left===st.total?"Start practice":(st.left? "Continue":"Practice again"))+'</button><button class="btn ghost" data-retry="'+t.id+'"'+(m?'':' disabled')+'>Retry missed ('+m+')</button></div></div>';
  return h;
}

/* ---------- practice: quiz ---------- */
function startQuiz(ids, topic, mode, startAt){
  if(!ids.length) return;
  V.topic = topic; V.quiz = {ids, i:startAt||0, mode, done:false, choice:null, right:0, wrong:0};
  render();
}
function viewQuiz(){
  const Z = V.quiz;
  if(Z.done){
    const t = Z.topic ? "" : "";
    let h = '<div class="card"><h2>Session complete</h2><p>You answered <b>'+Z.right+'</b> correctly and missed <b>'+Z.wrong+'</b> in this session.</p><div class="row">';
    h += '<button class="btn" data-'+(V.topic?'topic="'+V.topic+'"':'home="1"')+'>'+(V.topic?'Back to topic':'Back to overview')+'</button>';
    const m = missedIds(V.topic).length;
    h += '<button class="btn ghost" data-retry="'+(V.topic||"all")+'"'+(m?'':' disabled')+'>Retry missed ('+m+')</button></div></div>';
    return h;
  }

  const answered = Z.choice != null;

  h += '<div class="qhead"><div><span class="badge'+(t.kind==="RC"?" rc":"")+'">'+esc(t.kind==="RC"?(q.k||"Reading"):t.name)+'</span> '+(Z.mode==="retry"?'<span class="badge amber">Retry missed</span>':'')+'</div><div>Question '+(Z.i+1)+' of '+Z.ids.length+'</div></div>';
  let qbox = '';

  q.c.forEach((c,i) => {
    let cls = "choice";
    if(answered){ if(i===q.a) cls += " right"; else if(i===Z.choice) cls += " wrong"; }

  });
  if(answered){

      else qbox += '<li><b class="x">'+LETTERS[i]+' ✗ wrong.</b> '+esc(q.w[wi++]||"")+(i===Z.choice?' <i>(your answer)</i>':'')+'</li>';
    });
    qbox += '</ul></div><div class="row" style="margin-top:14px"><button class="btn green" data-next="1">'+(Z.i+1<Z.ids.length?'Next question':'Finish')+'</button></div>';
  }
  if(t.kind==="RC"){
    h += '<div class="rcwrap"><div class="card passage"><h3>'+esc(t.name)+'</h3>'+t.text.map(p => p.indexOf("## ")===0 ? '<h4 class="ph">'+esc(p.slice(3))+'</h4>' : '<p>'+esc(p)+'</p>').join("")+'</div><div class="card">'+qbox+'</div></div>';
  } else h += '<div class="card">'+qbox+'</div>';
  return h;
}
function choose(i){
  const Z = V.quiz, q = QS.find(x => x.id === Z.ids[Z.i]);
  if(Z.choice != null) return;
  Z.choice = i;
  const ok = i === q.a, prev = S.answers[q.id];
  S.answers[q.id] = {choice:i, correct:ok, tries:(prev?prev.tries:0)+1, ever:(prev&&prev.ever)||!ok};
  if(ok) Z.right++; else Z.wrong++;
  save(); render();
  const fb = $("#fb"); if(fb && fb.scrollIntoView) fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function nextQ(){
  const Z = V.quiz; Z.choice = null;
  if(Z.i+1 < Z.ids.length) Z.i++; else Z.done = true;
  render(); window.scrollTo(0,0);
}

/* ---------- tracker ---------- */
const LR_TYPES = [["main","Main Point","main"],["nassume","Necessary Assumption","nassume"],["sassume","Sufficient Assumption","sassume"],["strengthen","Strengthen","strengthen"],["weaken","Weaken","weaken"],["flaw","Flaw","flaw"],["infer","Must Be True / Most Strongly Supported","infer"],["pissue","Point at Issue","pissue"],["role","Role of a Statement","role"],["eval","Evaluate the Argument","eval"],["cond","Conditional Reasoning","cond"],["parallel","Parallel Reasoning","parallel"],["principle","Principle","principle"],["paradox","Paradox / Resolve","paradox"],["method","Method of Reasoning","method"]];
const RC_TYPES = [["rcMain","Main idea"],["rcDetail","Detail"],["rcInfer","Inference / author would agree"],["rcAttitude","Author attitude"],["rcFunction","Function / organization"],["rcCompare","Comparative reading"]];
const MISS_TYPES = {
  LR: LR_TYPES.map(a => ({key:a[0], label:a[1], topic:a[2]})),
  RC: RC_TYPES.map(a => ({key:a[0], label:"RC: "+a[1], rc:true}))
};
const REASONS = [["misread","Misread the question or passage"],["gap","Content gap (did not know the concept)"],["timing","Timing / rushed"],["overthought","Overthought or talked myself out of it"],["guessed","Guessed"]];
const REASON_BY_KEY = {}; REASONS.forEach(r => REASON_BY_KEY[r[0]] = r[1]);
const TYPE_BY_KEY = {}; MISS_TYPES.LR.concat(MISS_TYPES.RC).forEach(t => TYPE_BY_KEY[t.key] = t);
TYPE_BY_KEY.assume = {key:"assume", label:"Assumption (older log)", topic:"nassume"};
/* RC weak spots go to the passage with the most unfinished or missed questions of that kind */
function rcTopicFor(key){
  const cands = PASSAGES.map(p => { const qs = QS.filter(q => q.t === p.id && q.kk === key); const open = qs.filter(q => !(S.answers[q.id] && S.answers[q.id].correct)).length; return {id:p.id, n:qs.length, open}; }).filter(c => c.n);
  cands.sort((x,y) => y.open - x.open);
  return cands.length ? cands[0].id : PASSAGES[0].id;
}
const topicFor = ty => ty.rc ? rcTopicFor(ty.key) : ty.topic;
let trkSection = "LR", trkErr = "";
const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
function missGrid(){ return MISS_TYPES[trkSection].map(t => '<div><label for="m_'+t.key+'">'+esc(t.label)+'</label><input type="number" min="0" step="1" inputmode="numeric" id="m_'+t.key+'" data-miss="'+t.key+'" placeholder="0"></div>').join(""); }
function chartSvg(){
  const ts = S.tests.slice().sort((a,b) => (a.date||"").localeCompare(b.date||"") || a.id - b.id);
  if(!ts.length) return '<div class="empty">Log a test to see your score trend.</div>';
  const W=640,H=260,L=40,R=16,T=16,B=36, n=ts.length;
  const x = i => n===1 ? (L+W-R)/2 : L + (W-L-R)*i/(n-1);
  const y = p => T + (H-T-B)*(1-p/100);
  let s = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Score trend chart" id="chart">';
  [0,25,50,75,100].forEach(p => { s += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(p)+'" y2="'+y(p)+'" stroke="#e3e6eb"/><text x="'+(L-6)+'" y="'+(y(p)+4)+'" font-size="11" text-anchor="end" fill="#5f6673">'+p+'%</text>'; });
  [["LR","#1865f2"],["RC","#14a37f"]].forEach(g => {
    const pts = []; ts.forEach((t,i) => { if(t.section===g[0]) pts.push([x(i), y(100*t.correct/t.total), t]); });
    if(pts.length>1) s += '<polyline fill="none" stroke="'+g[1]+'" stroke-width="2.5" points="'+pts.map(p => p[0]+","+p[1]).join(" ")+'"/>';
    pts.forEach(p => { s += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="'+g[1]+'"><title>'+esc(p[2].name)+" ("+p[2].date+") "+p[2].correct+"/"+p[2].total+" = "+Math.round(100*p[2].correct/p[2].total)+'%</title></circle>'; });
  });
  ts.forEach((t,i) => { if(n<=8 || i%Math.ceil(n/8)===0) s += '<text x="'+x(i)+'" y="'+(H-14)+'" font-size="10.5" text-anchor="middle" fill="#5f6673">'+esc((t.date||"").slice(5))+'</text>'; });
  s += '</svg><div class="row" style="justify-content:center;font-size:13px;gap:18px"><span><b style="color:#1865f2">●</b> Logical Reasoning</span><span><b style="color:#14a37f">●</b> Reading Comprehension</span></div>';
  return s;
}
function weakHtml(){
  const tot = {}; let any = 0;
  S.tests.forEach(t => Object.keys(t.misses||{}).forEach(k => { tot[k] = (tot[k]||0) + t.misses[k]; any += t.misses[k]; }));
  const rows = Object.keys(tot).filter(k => tot[k] > 0 && TYPE_BY_KEY[k]).sort((a,b) => tot[b]-tot[a]);
  if(!rows.length) return '<div class="empty">'+(S.tests.length?'No per-type misses logged yet. Add them when you log a test to see your weak spots.':'Log a test with per-type misses to see your weak spots.')+'</div>';
  const max = tot[rows[0]];
  return rows.map((k,i) => { const ty = TYPE_BY_KEY[k], tp = topicFor(ty);
    return '<div class="wk"><div><b>'+esc(ty.label)+'</b></div><div class="bar"><i class="a" style="width:'+(100*tot[k]/max)+'%"></i></div><div>'+tot[k]+' missed</div><div class="go"><button class="btn sm '+(i<3?'green':'ghost')+'" data-topic="'+tp+'">'+(i<3?'Practice: ':'')+esc(topicOf(tp).name)+' →</button></div></div>'; }).join("")
   + '<p class="sub" style="margin:10px 0 0">Based on '+any+' logged misses. The top three are highlighted in green.</p>';
}
function reasonsHtml(){
  const tot = {}; let any = 0, blind = 0;
  S.tests.forEach(t => { if(t.blind) blind++; Object.keys(t.reasons||{}).forEach(k => { tot[k] = (tot[k]||0) + t.reasons[k]; any += t.reasons[k]; }); });
  if(!any) return '<div class="empty">Tag why you missed questions when you log a test to see your pattern.</div>';
  const rows = REASONS.filter(r => tot[r[0]] > 0).sort((a,b) => tot[b[0]]-tot[a[0]]), max = tot[rows[0][0]];
  return rows.map(r => '<div class="wk"><div><b>'+esc(r[1])+'</b></div><div class="bar"><i class="a" style="width:'+(100*tot[r[0]]/max)+'%"></i></div><div>'+tot[r[0]]+'</div><div class="go"></div></div>').join("")
   + '<p class="sub" style="margin:10px 0 0">'+blind+' of '+S.tests.length+' logged sections had blind review. Misreads and overthinking are usually fixed by a slower, structured read, not by more content.</p>';
}
function viewTracker(){
  let h = '<h1>Real-test tracker</h1><p class="sub">Take real sections on <a href="https://www.lsac.org/lawhub" target="_blank" rel="noopener">LSAC LawHub</a>, then log the results here. This site does not contain or copy any real test questions.</p>';
  h += '<div class="card"><h2>Log a section</h2><form id="tf"><div class="form">'
    + '<div><label for="t_name">Test name</label><input id="t_name" placeholder="e.g. PrepTest 101" maxlength="60"></div>'
    + '<div><label for="t_date">Date</label><input id="t_date" type="date" value="'+today()+'"></div>'
    + '<div><label for="t_sec">Section</label><select id="t_sec"><option value="LR"'+(trkSection==="LR"?" selected":"")+'>Logical Reasoning</option><option value="RC"'+(trkSection==="RC"?" selected":"")+'>Reading Comprehension</option></select></div>'
    + '<div><label for="t_total">Questions</label><input id="t_total" type="number" min="1" step="1" inputmode="numeric" placeholder="e.g. 25"></div>'
    + '<div><label for="t_correct">Number correct</label><input id="t_correct" type="number" min="0" step="1" inputmode="numeric" placeholder="e.g. 20"></div></div>'
    + '<h3 style="margin-top:16px">Optional: how many did you miss, by question type?</h3><div class="misses" id="misses">'+missGrid()+'</div>'
    + '<h3 style="margin-top:16px">Optional: why did you miss them?</h3><div class="misses" id="reasons">'+REASONS.map(r => '<div><label for="r_'+r[0]+'">'+esc(r[1])+'</label><input type="number" min="0" step="1" inputmode="numeric" id="r_'+r[0]+'" data-reason="'+r[0]+'" placeholder="0"></div>').join("")+'</div>'
    + '<div class="blindrow"><label class="chk"><input type="checkbox" id="t_blind"> Blind review done (I re-worked the missed questions untimed before checking the answers)</label><div><label for="t_blindscore">Score after blind review (optional)</label><input id="t_blindscore" type="number" min="0" step="1" inputmode="numeric" placeholder="e.g. 23"></div></div>'
    + '<div class="err" id="terr">'+esc(trkErr)+'</div><button class="btn green" type="submit" id="t_add">Add to tracker</button></form></div>';
  h += '<div class="card"><h2>Logged tests</h2>';
  if(!S.tests.length) h += '<div class="empty">No tests logged yet.</div>';
  else {
    const ts = S.tests.slice().sort((a,b) => (b.date||"").localeCompare(a.date||"") || b.id - a.id);
    h += '<div class="tblwrap"><table id="ttable"><thead><tr><th>Date</th><th>Test</th><th>Section</th><th>Score</th><th>%</th><th>Misses by type</th><th>Why</th><th>Blind</th><th></th></tr></thead><tbody>'
      + ts.map(t => { const ms = Object.keys(t.misses||{}).filter(k => t.misses[k]>0 && TYPE_BY_KEY[k]).map(k => esc(TYPE_BY_KEY[k].label)+" ×"+t.misses[k]).join(", ");
        const rs = Object.keys(t.reasons||{}).filter(k => t.reasons[k]>0 && REASON_BY_KEY[k]).map(k => esc(REASON_BY_KEY[k].split(" (")[0])+" ×"+t.reasons[k]).join(", ");
        const bl = t.blind ? "Yes"+(t.blindScore!=null?" ("+t.blindScore+"/"+t.total+")":"") : "—";
        return '<tr><td>'+esc(t.date)+'</td><td>'+esc(t.name)+'</td><td><span class="pill '+(t.section==="LR"?"lr":"rc")+'">'+t.section+'</span></td><td>'+t.correct+'/'+t.total+'</td><td><b>'+Math.round(100*t.correct/t.total)+'%</b></td><td>'+(ms||'<span style="color:#5f6673">—</span>')+'</td><td>'+(rs||'<span style="color:#5f6673">—</span>')+'</td><td>'+bl+'</td><td><button class="btn danger sm" data-deltest="'+t.id+'">Delete</button></td></tr>'; }).join("")
      + '</tbody></table></div>';
  }
  h += '</div><div class="card"><h2>Score trend</h2>'+chartSvg()+'</div>';
  h += '<div class="card"><h2>Weak spots by question type</h2>'+weakHtml()+'</div>';
  h += '<div class="card"><h2>Why you miss questions</h2>'+reasonsHtml()+'</div>';
  return h;
}
function addTest(e){
  e.preventDefault();
  const total = parseInt($("#t_total").value,10), correct = parseInt($("#t_correct").value,10);
  const section = $("#t_sec").value, date = $("#t_date").value || today();
  const name = $("#t_name").value.trim() || "Untitled test";
  const misses = {}; let sum = 0;
  document.querySelectorAll("[data-miss]").forEach(inp => { const v = parseInt(inp.value,10); if(v>0){ misses[inp.dataset.miss] = v; sum += v; } });
  const reasons = {}; let rsum = 0;
  document.querySelectorAll("[data-reason]").forEach(inp => { const v = parseInt(inp.value,10); if(v>0){ reasons[inp.dataset.reason] = v; rsum += v; } });
  const blind = !!$("#t_blind").checked, bsRaw = $("#t_blindscore").value, blindScore = bsRaw === "" ? null : parseInt(bsRaw,10);
  trkErr = "";
  if(!(total>0)) trkErr = "Enter how many questions were in the section.";
  else if(isNaN(correct) || correct<0 || correct>total) trkErr = "Number correct must be between 0 and "+total+".";
  else if(sum > total-correct) trkErr = "You listed "+sum+" misses by type, but only "+(total-correct)+" questions were missed.";
  else if(rsum > total-correct) trkErr = "You listed "+rsum+" reasons, but only "+(total-correct)+" questions were missed.";
  else if(blindScore != null && (isNaN(blindScore) || blindScore < 0 || blindScore > total)) trkErr = "Score after blind review must be between 0 and "+total+".";
  if(trkErr){ $("#terr").textContent = trkErr; return; }
  S.tests.push({id:Date.now()+Math.floor(Math.random()*1000), name, date, section, total, correct, misses, reasons, blind, blindScore});
  save(); render();
}

/* ---------- data ---------- */
function download(name, text, mime){
  const blob = new Blob([text], {type:mime}), url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function csvCell(v){ v = String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function exportJson(){ download("lsat-study-data-"+today()+".json", JSON.stringify({exported:new Date().toISOString(), answers:S.answers, tests:S.tests}, null, 2), "application/json"); }
function exportCsv(){
  const rows = [["date","test","section","questions","correct","percent","misses_by_type","miss_reasons","blind_review","score_after_blind_review"]];
  S.tests.slice().sort((a,b) => (a.date||"").localeCompare(b.date||"")).forEach(t => rows.push([t.date,t.name,t.section,t.total,t.correct,Math.round(100*t.correct/t.total),Object.keys(t.misses||{}).map(k => (TYPE_BY_KEY[k]?TYPE_BY_KEY[k].label:k)+" x"+t.misses[k]).join("; "),Object.keys(t.reasons||{}).map(k => (REASON_BY_KEY[k]||k).split(" (")[0]+" x"+t.reasons[k]).join("; "),t.blind?"yes":"no",t.blindScore==null?"":t.blindScore]));
  download("lsat-test-log-"+today()+".csv", rows.map(r => r.map(csvCell).join(",")).join("\n"), "text/csv");
}
function viewData(){
  const o = stats();
  return '<h1>Your data</h1><p class="sub">Everything is stored only in this browser on this device (localStorage). Nothing is uploaded anywhere.</p>'
   + '<div class="card"><h2>Export</h2><p>Practice progress: '+(o.correct+o.missed)+' of '+o.total+' questions attempted. Logged tests: '+S.tests.length+'.</p><div class="row"><button class="btn" id="exp_json">Export everything (JSON)</button><button class="btn ghost" id="exp_csv">Export test log (CSV)</button></div></div>'
   + '<div class="card"><h2>Reset</h2><p>Erases all practice progress and all logged tests from this browser. Export first if you want a copy.</p><div class="row"><button class="btn danger" id="reset_prog">Reset practice progress</button><button class="btn danger" id="reset_all">Reset everything</button></div></div>';
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === V.tab));
  $("#layout").classList.toggle("nosb", V.tab !== "practice");
  $("#menu").style.display = V.tab === "practice" ? "" : "none";
  let h;
  if(V.tab === "practice"){ renderSide(); h = V.quiz ? viewQuiz() : (V.topic ? viewTopic() : viewHome()); }
  else if(V.tab === "tracker") h = viewTracker();
  else h = viewData();
  $("#main").innerHTML = h + '<p class="note">All practice questions and passages are original and written for personal study. They are not real LSAT questions. Real tests: <a href="https://www.lsac.org/lawhub" target="_blank" rel="noopener">LSAC LawHub</a>.</p>';
  $("#side").classList.remove("open");
}
document.addEventListener("click", e => {
  const el = e.target.closest("button, a"); if(!el) return;
  const d = el.dataset;
  if(el.id === "menu"){ $("#side").classList.toggle("open"); return; }
  if(d.tab){ V.tab = d.tab; V.quiz = null; render(); window.scrollTo(0,0); return; }
  if(d.home){ V.tab = "practice"; V.topic = null; V.quiz = null; render(); window.scrollTo(0,0); return; }
  if(d.topic){ V.tab = "practice"; V.topic = d.topic; V.quiz = null; render(); window.scrollTo(0,0); return; }
  if(d.start){ const ids = qsOf(d.start).map(q => q.id); let at = ids.findIndex(id => !S.answers[id]); if(at<0) at = 0; startQuiz(ids, d.start, "normal", at); window.scrollTo(0,0); return; }
  if(d.jump){ const q = QS.find(x => x.id===d.jump), ids = qsOf(q.t).map(x => x.id); startQuiz(ids, q.t, "normal", ids.indexOf(q.id)); window.scrollTo(0,0); return; }
  if(d.retry){ const tid = d.retry==="all" ? null : d.retry; const ids = missedIds(tid); if(ids.length){ V.tab = "practice"; startQuiz(ids, tid, "retry", 0); window.scrollTo(0,0);} return; }
  if(d.choice != null){ choose(parseInt(d.choice,10)); return; }
  if(d.next){ nextQ(); return; }
  if(d.deltest){ if(confirm("Delete this logged test?")){ S.tests = S.tests.filter(t => String(t.id) !== d.deltest); save(); render(); } return; }
  if(el.id === "exp_json") exportJson();
  if(el.id === "exp_csv") exportCsv();
  if(el.id === "reset_prog" && confirm("Erase all practice progress? Logged tests are kept.")){ S.answers = {}; save(); V = {tab:"data",topic:null,quiz:null}; render(); }
  if(el.id === "reset_all" && confirm("Erase ALL data (practice progress and logged tests)? This cannot be undone.")){ S = {answers:{},tests:[]}; save(); V = {tab:"data",topic:null,quiz:null}; render(); }
});
document.addEventListener("change", e => { if(e.target.id === "t_sec"){ trkSection = e.target.value; $("#misses").innerHTML = missGrid(); } });
document.addEventListener("submit", e => { if(e.target.id === "tf") addTest(e); });
render();

</script>
</body>
</html>
